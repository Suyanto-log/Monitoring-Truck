<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Truck Bongkar Muat - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #165DFF;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --gray: #86909C;
        }
        body {
            background-color: #F2F3F5;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .sidebar {
            background-color: #fff;
            height: 100vh;
            position: fixed;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 220px;
        }
        .sidebar .nav-link {
            color: #4E5969;
            padding: 12px 16px;
            margin: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link.active {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #F2F3F5;
        }
        .main-content {
            margin-left: 220px;
            padding: 24px;
        }
        .card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            color: #1D2129;
        }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <div class="text-center mb-4 mt-2">
        <h5 class="text-primary fw-bold">🚛 Logistik App</h5>
        <p class="text-muted small mb-0">Monitoring Bongkar Muat</p>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link active" href="register.html"><i class="bi bi-truck"></i> Register</a>
        <a class="nav-link" href="tat.html"><i class="bi bi-clock-history"></i> TAT</a>
        <a class="nav-link" href="status.html"><i class="bi bi-list-check"></i> Status</a>
        <a class="nav-link" href="putaway.html"><i class="bi bi-box-seam"></i> Putaway</a>
        <a class="nav-link" href="pallet.html"><i class="bi bi-grid-3x3-gap"></i> Pallet</a>
        <a class="nav-link" href="user.html"><i class="bi bi-people"></i> User</a>
        <a class="nav-link" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Summary</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-semibold">Input Data Register Truck</h4>
            <p class="text-muted mb-0">Pencatatan awal kedatangan armada truk di logistik</p>
        </div>
    </div>

    <div class="card" id="register">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold"><i class="bi bi-truck me-2"></i> Form Registrasi</h5>
        </div>
        <div class="card-body">
            <form id="formRegister">
              
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">No Pol</label>
                    <div class="col-sm-3">
                        <input type="text" id="nopol" class="form-control" placeholder="Contoh: B 1234 ABC" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Transporter</label>
                    <div class="col-sm-4">
                        <input type="text" id="transporter" class="form-control" placeholder="Nama Perusahaan Angkutan" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Shipment</label>
                    <div class="col-sm-3">
                        <input type="text" id="shipment" class="form-control" placeholder="Nomor Shipment">
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Jenis Truck</label>
                    <div class="col-sm-3">
                        <select id="jenis_kendaraan" class="form-select" required>
                            <option value="">Pilih Jenis...</option>
                            <option value="Wing Box">Wing Box</option>
                            <option value="Container 40">Container 40</option>
                            <option value="Container 20">Container 20</option>
                            <option value="Pick Up">Pick Up</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Driver</label>
                    <div class="col-sm-4">
                        <input type="text" id="nama_driver" class="form-control" placeholder="Nama Lengkap Supir">
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Waktu Kedatangan</label>
                    <div class="col-sm-4">
                        <input type="datetime-local" id="waktu_kedatangan" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Tujuan</label>
                    <div class="col-sm-4">
                        <input type="text" id="tujuan" class="form-control" placeholder="Lokasi Tujuan Gudang">
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label fw-medium">Type Order</label>
                    <div class="col-sm-3">
                        <select id="type_order" class="form-select" required>
                            <option value="MT">MT</option>
                            <option value="SO">SO</option>
                            <option value="STO">STO</option>
                            <option value="STO/JKT">STO/JKT</option>
                        </select>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-sm-2"></div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary px-4 py-2 w-100" id="btnSimpan">
                            <i class="bi bi-cloud-arrow-up me-2"></i>Simpan ke Google Sheets
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbziAZG9GWaHlIvCVSm_W-V8D32U_VVX0oFR_eXMCHW7uWUA0KiX-qRfn3bBRA7br5VrsQ/exec"; 

    document.getElementById('formRegister').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Menyimpan...';

        const payload = {
            formType: "register", 
            data: {
                nopol: document.getElementById('nopol').value,
                transporter: document.getElementById('transporter').value,
                shipment: document.getElementById('shipment').value,
                jenis_kendaraan: document.getElementById('jenis_kendaraan').value,
                nama_driver: document.getElementById('nama_driver').value,
                waktu_kedatangan: document.getElementById('waktu_kedatangan').value,
                tujuan: document.getElementById('tujuan').value,
                type_order: document.getElementById('type_order').value
            }
        };

        // Mengaktifkan mode CORS kilat
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'cors', 
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "success") {
                alert('Sukses! Data Register Truk berhasil ditambahkan ke Google Sheets.');
                // PERBAIKAN 2: Mengubah formTat menjadi formRegister agar form ter-reset dengan benar
                document.getElementById('formRegister').reset(); 
            } else {
                alert('Gagal sistem Google Sheets: ' + res.message);
            }
        })
        .catch(error => {
            console.error('Terjadi Error:', error);
            alert('Gagal menyimpan data. Pastikan Apps Script Anda menggunakan kode modifikasi terbaru.');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Simpan ke Google Sheets';
        });
    });
</script>
</body>
</html>
