<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Truck Bongkar Muat - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #F2F3F5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #fff; height: 100vh; position: fixed; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 220px; }
        .sidebar .nav-link { color: #4E5969; padding: 12px 16px; margin: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .sidebar .nav-link.active { background-color: #165DFF; color: white; font-weight: 500; }
        .sidebar .nav-link:hover:not(.active) { background-color: #F2F3F5; }
        .main-content { margin-left: 220px; padding: 24px; }
        .card { border-radius: 8px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <div class="text-center mb-4 mt-2">
        <h5 class="text-primary fw-bold">🚛 Logistik App</h5>
        <p class="text-muted small mb-0">Monitoring Bongkar Muat</p>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link active" href="register.html"><i class="bi bi-truck"></i> Register</a>
        <a class="nav-link" href="tat.html"><i class="bi bi-clock-history"></i> TAT</a>
        <a class="nav-link" href="status.html"><i class="bi bi-list-check"></i> Status</a>
        <a class="nav-link" href="putaway.html"><i class="bi bi-box-seam"></i> Putaway</a>
        <a class="nav-link" href="pallet.html"><i class="bi bi-grid-3x3-gap"></i> Pallet</a>
        <a class="nav-link" href="user.html"><i class="bi bi-people"></i> User</a>
        <a class="nav-link" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Summary</a>
    </nav>
</div>

<div class="main-content">
    <div class="card p-4">
        <h5 class="mb-4 fw-semibold text-primary"><i class="bi bi-truck me-2"></i> Form Registrasi Truk Kedatangan</h5>
        
        <form id="formRegister">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">No. Registrasi</label>
                <div class="col-sm-4">
                    <input type="text" id="no_registrasi" class="form-control" placeholder="Otomatis / Input Manual" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">No. Polisi</label>
                <div class="col-sm-4">
                    <input type="text" id="nopol" class="form-control" placeholder="B 1234 ABC" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Transporter</label>
                <div class="col-sm-4">
                    <input type="text" id="transporter" class="form-control" placeholder="Nama Vendor" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Shipment</label>
                <div class="col-sm-4">
                    <input type="text" id="shipment" class="form-control" placeholder="No Shipment" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Jenis Kendaraan</label>
                <div class="col-sm-3">
                    <input type="text" id="jenis_kendaraan" class="form-control" placeholder="CDD / CDE / Wingbox" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Nama Driver</label>
                <div class="col-sm-4">
                    <input type="text" id="nama_driver" class="form-control" placeholder="Nama Supir" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Waktu Kedatangan</label>
                <div class="col-sm-4">
                    <input type="datetime-local" id="waktu_kedatangan" class="form-control" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Tujuan</label>
                <div class="col-sm-4">
                    <input type="text" id="tujuan" class="form-control" placeholder="Lokasi Tujuan" required>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Type Order</label>
                <div class="col-sm-3">
                    <select class="form-select" id="type_order">
                        <option>MT</option>
                        <option>SO</option>
                        <option>STO</option>
                    </select>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-2"></div>
                <div class="col-sm-4">
                    <button type="submit" class="btn btn-primary w-100" id="btnSimpanReg">
                        <i class="bi bi-cloud-arrow-up me-2"></i>Simpan Registrasi
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // ⚠️ MASUKKAN URL WEB APP CURRENT DEPLOYMENT ANDA DI SINI 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHVRVyYsZgL0KsqWcnfqItKQTpMjB1U8iw7s6IlNcZCIkSA2Dc70D567PcjNRrURuOIg/exec";

    window.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('waktu_kedatangan').value = now.toISOString().slice(0,16);
        
        // Trik generate nomor registrasi otomatis sederhana berbasis waktu jika kolom kosong
        document.getElementById('no_registrasi').value = "REG-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + "-" + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    });

    document.getElementById('formRegister').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSimpanReg');
        btn.disabled = true;
        btn.innerHTML = 'Menyimpan...';

        // PAYLOAD DISESUAIKAN PERSIS DENGAN KATA KUNCI DI CODE.GS ANDA
        const payload = {
            formType: "register",
            data: {
                no_registrasi: document.getElementById('no_registrasi').value,
                nopol: document.getElementById('nopol').value,
                transporter: document.getElementById('transporter').value,
                shipment: document.getElementById('shipment').value,
                jenis_kendaraan: document.getElementById('jenis_kendaraan').value,
                nama_driver: document.getElementById('nama_driver').value,
                waktu_kedatangan: document.getElementById('waktu_kedatangan').value,
                tujuan: document.getElementById('tujuan').value,
                type_order: document.getElementById('type_order').value
            }
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Bypass CORS Browser Lokal
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('Sukses! Data Register berhasil ditambahkan ke Google Sheets.');
            document.getElementById('formRegister').reset();
            
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('waktu_kedatangan').value = now.toISOString().slice(0,16);
            document.getElementById('no_registrasi').value = "REG-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + "-" + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Gagal memproses pengiriman data register.');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Simpan Registrasi';
        });
    });
</script>
</body>
</html>
