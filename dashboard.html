<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Truck Bongkar Muat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #165DFF;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --gray: #86909C;
        }
        body {
            background-color: #F2F3F5;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .sidebar {
            background-color: #fff;
            height: 100vh;
            position: fixed;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 220px;
        }
        .sidebar .nav-link {
            color: #4E5969;
            padding: 12px 16px;
            margin: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link.active {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #F2F3F5;
        }
        .main-content {
            margin-left: 220px;
            padding: 24px;
        }
        .card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            color: #1D2129;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .table th {
            color: #4E5969;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar p-3">
    <div class="text-center mb-4 mt-2">
        <h4 class="text-primary font-family="Raleway" fw-bold">🚛 Logistics App</h4>
        <p class="text-muted small mb-0">Monitoring Bongkar Muat</p>
    </div>
<nav class="nav flex-column">
    <a class="nav-link active" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" href="register.html"><i class="bi bi-truck"></i> Register</a>
    <a class="nav-link" href="tat.html"><i class="bi bi-clock-history"></i> TAT</a>
    <a class="nav-link" href="status.html"><i class="bi bi-list-check"></i> Status</a>
    <a class="nav-link" href="putaway.html"><i class="bi bi-box-seam"></i> Putaway</a>
    <a class="nav-link" href="pallet.html"><i class="bi bi-grid-3x3-gap"></i> Pallet</a>
    <a class="nav-link" href="user.html"><i class="bi bi-people"></i> User</a>
    <a class="nav-link" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Summary</a>
</nav>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 id="page-title" class="mb-1 font-family="Raleway" fw-semibold">Dashboard In/Out Truck</h4>
            <p id="page-desc" class="text-muted mb-0">Pantau proses bongkar muat truk secara real-time</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary"><i class="bi bi-bell"></i></button>
            <button class="btn btn-primary"><i class="bi bi-person-circle"></i> Profil</button>
        </div>
    </div>

    <!-- Tempat Konten Dimuat -->
    <div id="content-area">
        <!-- Konten akan dimuat di sini lewat JavaScript -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Truk Masuk Hari Ini</p>
                            <h3 class="fw-bold text-primary">24</h3>
                        </div>
                        <i class="bi bi-truck text-primary fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Sedang Proses</p>
                            <h3 class="fw-bold text-warning">8</h3>
                        </div>
                        <i class="bi bi-gear-wide-connected text-warning fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Selesai</p>
                            <h3 class="fw-bold text-success">16</h3>
                        </div>
                        <i class="bi bi-check-circle text-success fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Total Pallet</p>
                            <h3 class="fw-bold text-secondary">450</h3>
                        </div>
                        <i class="bi bi-grid-3x3-gap text-secondary fs-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
