<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Truck Bongkar Muat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #165DFF;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --gray: #86909C;
        }
        body {
            background-color: #F2F3F5;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .sidebar {
            background-color: #fff;
            height: 100vh;
            position: fixed;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 220px;
        }
        .sidebar .nav-link {
            color: #4E5969;
            padding: 12px 16px;
            margin: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link.active {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #F2F3F5;
        }
        .main-content {
            margin-left: 220px;
            padding: 24px;
        }
        .card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            color: #1D2129;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .table th {
            color: #4E5969;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar p-3">
    <div class="text-center mb-4 mt-2">
        <h5 class="text-primary fw-bold">🚛 Logistik App</h5>
        <p class="text-muted small mb-0">Monitoring Bongkar Muat</p>
    </div>
<nav class="nav flex-column">
    <a class="nav-link active" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" href="register.html"><i class="bi bi-truck"></i> Register</a>
    <a class="nav-link" href="tat.html"><i class="bi bi-clock-history"></i> TAT</a>
    <a class="nav-link" href="status.html"><i class="bi bi-list-check"></i> Status</a>
    <a class="nav-link" href="putaway.html"><i class="bi bi-box-seam"></i> Putaway</a>
    <a class="nav-link" href="pallet.html"><i class="bi bi-grid-3x3-gap"></i> Pallet</a>
    <a class="nav-link" href="user.html"><i class="bi bi-people"></i> User</a>
    <a class="nav-link" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Summary</a>
</nav>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-semibold">Selamat Datang, Admin</h4>
            <p class="text-muted mb-0">Pantau proses bongkar muat truk secara real-time</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary"><i class="bi bi-bell"></i></button>
            <button class="btn btn-primary"><i class="bi bi-person-circle"></i> Profil</button>
        </div>
    </div>

<!-- TAT FORM -->
<div class="card" id="tat">
  <div class="card-header bg-white py-3">
    <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2"></i> Pencatatan TAT (Waktu Proses)</h5>
  </div>
  <div class="card-body">
    <form>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Tanggal</label>
        <div class="col-sm-3">
          <input type="datetime-local" class="form-control">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">No. Polisi</label>
        <div class="col-sm-2">
          <select class="form-select">
            <option>B 1234 ABC</option>
            <option>B 5678 DEF</option>
          </select>
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">User</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" placeholder="Nama Admin">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Transporter</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" placeholder="">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Tujuan</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" placeholder="">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Shipment</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" placeholder="4519403296">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Qty Cs</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" placeholder="Jumlah Karton">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Qty Pallet</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" placeholder="Jumlah Pallet">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">No. Docket</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" placeholder="3117465">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">No. Seal</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" placeholder="567/568/568">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Type Order</label>
        <div class="col-sm-2">
          <select class="form-select">
            <option>MT</option>
            <option>SO</option>
            <option>STO</option>
            <option>STO/JKT</option>
          </select>
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Status</label>
        <div class="col-sm-2">
          <select class="form-select">
            <option>QI</option>
            <option>Release</option>
          </select>
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Category</label>
        <div class="col-sm-2">
          <select class="form-select">
            <option>Shuttle</option>
            <option>Direct</option>
          </select>
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Driver</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" placeholder="Nama Supir">
        </div>
      </div>
      <div class="row mb-2">
        <label class="col-sm-2 col-form-label">Loading End</label>
        <div class="col-sm-3">
          <input type="datetime-local" class="form-control">
        </div>
      </div>

      <!-- Tombol -->
      <div class="row mb-2">
        <div class="col-sm-5 offset-sm-3">
          <button class="btn btn-primary w-100">Hitung & Simpan</button>
        </div>
      </div>

      <!-- Alert Info -->
      <div class="row">
        <div class="col-sm-5 offset-sm-3">
          <div class="alert alert-info mb-0">
            <strong>Total Waktu Proses:</strong> 01:45:00 | <strong>Status:</strong> Normal
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
