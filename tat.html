<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Truck Bongkar Muat - TAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #165DFF;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --gray: #86909C;
        }
        body {
            background-color: #F2F3F5;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .sidebar {
            background-color: #fff;
            height: 100vh;
            position: fixed;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 220px;
        }
        .sidebar .nav-link {
            color: #4E5969;
            padding: 12px 16px;
            margin: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link.active {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #F2F3F5;
        }
        .main-content {
            margin-left: 220px;
            padding: 24px;
        }
        .card {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            color: #1D2129;
        }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <div class="text-center mb-4 mt-2">
        <h5 class="text-primary fw-bold">🚛 Logistik App</h5>
        <p class="text-muted small mb-0">Monitoring Bongkar Muat</p>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="register.html"><i class="bi bi-truck"></i> Register</a>
        <a class="nav-link active" href="tat.html"><i class="bi bi-clock-history"></i> TAT</a>
        <a class="nav-link" href="status.html"><i class="bi bi-list-check"></i> Status</a>
        <a class="nav-link" href="putaway.html"><i class="bi bi-box-seam"></i> Putaway</a>
        <a class="nav-link" href="pallet.html"><i class="bi bi-grid-3x3-gap"></i> Pallet</a>
        <a class="nav-link" href="user.html"><i class="bi bi-people"></i> User</a>
        <a class="nav-link" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Summary</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-semibold">Selamat Datang, Admin</h4>
            <p class="text-muted mb-0">Pantau proses bongkar muat truk secara real-time</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary"><i class="bi bi-bell"></i></button>
            <button class="btn btn-primary"><i class="bi bi-person-circle"></i> Profil</button>
        </div>
    </div>

    <div class="card" id="tat">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2"></i> Pencatatan TAT (Waktu Proses)</h5>
        </div>
        <div class="card-body">
            <form id="formTat">
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Tanggal</label>
                    <div class="col-sm-3">
                        <input type="datetime-local" id="tanggal" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Nomor Polisi</label>
                    <div class="col-sm-3">
                        <input type="text" id="nopol" class="form-control" placeholder="Contoh: B 1234 ABC" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">User</label>
                    <div class="col-sm-3">
                        <input type="text" id="user" class="form-control" placeholder="Nama Admin" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Transporter</label>
                    <div class="col-sm-3">
                        <input type="text" id="transporter" class="form-control" placeholder="Nama Vendor Armada" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Tujuan</label>
                    <div class="col-sm-3">
                        <input type="text" id="tujuan" class="form-control" placeholder="Lokasi Tujuan" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Shipment</label>
                    <div class="col-sm-3">
                        <input type="text" id="shipment" class="form-control" placeholder="4519403296" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Qty Cs</label>
                    <div class="col-sm-2">
                        <input type="number" id="qty_cs" class="form-control" placeholder="Jumlah Karton" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Qty Pallet</label>
                    <div class="col-sm-2">
                        <input type="number" id="qty_pallet" class="form-control" placeholder="Jumlah Pallet" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">No. Docket</label>
                    <div class="col-sm-2">
                        <input type="text" id="no_docket" class="form-control" placeholder="3117465" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">No. Seal</label>
                    <div class="col-sm-2">
                        <input type="text" id="no_seal" class="form-control" placeholder="567/568/568" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Channel</label>
                    <div class="col-sm-2">
                        <select class="form-select" id="type_order">
                            <option>MT</option>
                            <option>SO</option>
                            <option>STO</option>
                            <option>STO/JKT</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Status</label>
                    <div class="col-sm-2">
                        <select class="form-select" id="status">
                            <option>QI</option>
                            <option>Release</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Category</label>
                    <div class="col-sm-2">
                        <select class="form-select" id="category">
                            <option>Shuttle</option>
                            <option>Direct</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Driver</label>
                    <div class="col-sm-3">
                        <input type="text" id="driver" class="form-control" placeholder="Nama Supir" required>
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">Loading End</label>
                    <div class="col-sm-3">
                        <input type="datetime-local" id="loading_end" class="form-control" required>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-sm-2"></div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary px-4 py-2 w-100" id="btnSimpan">
                            <i class="bi bi-cloud-arrow-up me-2"></i>Simpan ke Google Sheets
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbziAZG9GWaHlIvCVSm_W-V8D32U_VVX0oFR_eXMCHW7uWUA0KiX-qRfn3bBRA7br5VrsQ/exec"; 

    // PERBAIKAN: Mengarahkan listener ke formTat yang benar
    document.getElementById('formTat').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Menyimpan...';

        // Pembuatan payload JSON target ke tab sheet 'tat'
        const payload = {
            formType: "tat", 
            data: {
                tanggal: document.getElementById('tanggal').value,
                nopol: document.getElementById('nopol').value,
                user: document.getElementById('user').value,
                transporter: document.getElementById('transporter').value,
                tujuan: document.getElementById('tujuan').value,
                shipment: document.getElementById('shipment').value,
                qty_cs: document.getElementById('qty_cs').value,
                qty_pallet: document.getElementById('qty_pallet').value,
                no_docket: document.getElementById('no_docket').value,
                no_seal: document.getElementById('no_seal').value,
                type_order: document.getElementById('type_order').value, // PERBAIKAN: Ditambahkan tanda koma (,)
                status: document.getElementById('status').value,         // PERBAIKAN: Ditambahkan tanda koma (,)
                category: document.getElementById('category').value,     // PERBAIKAN: Ditambahkan tanda koma (,)
                driver: document.getElementById('driver').value,
                loading_end: document.getElementById('loading_end').value
            }
        };

        // PERBAIKAN: Mengaktifkan mode CORS kilat
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'cors', 
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "success") {
                alert('Sukses! Data TAT Logistik berhasil ditambahkan ke Google Sheets.');
                document.getElementById('formTat').reset(); 
            } else {
                alert('Gagal sistem Google Sheets: ' + res.message);
            }
        })
        .catch(error => {
            console.error('Terjadi Error:', error);
            alert('Gagal menyimpan data. Pastikan Apps Script Anda menggunakan kode modifikasi terbaru.');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Simpan ke Google Sheets';
        });
    });
</script>
</body>
</html>
